name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json found; skipping npm install."
            exit 0
          fi
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json found; skipping build."
            exit 0
          fi
          npm run build

      - name: Deploy to Netlify
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master') }}
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ ! -d build ]; then
            echo "No build directory found; skipping Netlify deployment."
            exit 0
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "NETLIFY_SITE_ID is not configured; skipping Netlify deployment."
            exit 0
          fi
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN is not configured; skipping Netlify deployment."
            exit 0
          fi
          npm install -g netlify-cli
          netlify deploy --prod --dir=build --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
